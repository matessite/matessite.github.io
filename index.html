<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Juegos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f6f7fb;
      color: #20232a;
    }
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    h1 {
      margin-bottom: 12px;
      font-size: 2rem;
    }
    .search-box {
      width: 100%;
      max-width: 480px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #cdd2db;
      box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.08);
      margin-bottom: 22px;
      font-size: 1rem;
    }
    .message {
      color: #475569;
      margin-bottom: 20px;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 220px));
      justify-content: center;
      gap: 10px;
      margin: 0 auto;
      padding: 0;
      max-width: 100%;
    }
    .game-card {
      display: block;
      width: 100%;
      max-width: 220px;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      min-height: 0;
    }
    .game-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
    }
    .game-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #e2e8f0 0%, #f8fafc 100%);
      min-height: 140px;
    }
    .game-info {
      padding: 10px;
    }
    .game-title {
      margin: 0;
      font-size: 0.88rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }
    .game-subtitle {
      margin: 5px 0 0;
      color: #475569;
      font-size: 0.82rem;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Lista de juegos</h1>
    <input id="searchInput" class="search-box" type="search" placeholder="Buscar juego..." aria-label="Buscar juego" />
    <div id="gamesList" class="games-grid"></div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const gamesList = document.getElementById('gamesList');
    let games = [];

    function normalize(text) {
      return text.trim().toLowerCase();
    }

    function renderGames(filter = '') {
      const normalizedFilter = normalize(filter);
      const filteredGames = games.filter(game => normalize(game.title).includes(normalizedFilter));

      gamesList.innerHTML = '';

      if (filteredGames.length === 0) {
        return;
      }

      for (const game of filteredGames) {
        const card = document.createElement('a');
        card.className = 'game-card';
        card.href = game.href;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        const thumb = document.createElement('img');
        thumb.className = 'game-thumb';
        thumb.src = game.thumb || 'https://via.placeholder.com/400?text=Sin+miniatura';
        thumb.alt = `Miniatura de ${game.title}`;

        const info = document.createElement('div');
        info.className = 'game-info';

        const title = document.createElement('h2');
        title.className = 'game-title';
        title.textContent = game.title;

        const subtitle = document.createElement('p');
        subtitle.className = 'game-subtitle';
        subtitle.textContent = game.thumb ? '' : 'Añade una miniatura en GAMENAMES para esta tarjeta.';

        info.appendChild(title);
        info.appendChild(subtitle);
        card.appendChild(thumb);
        card.appendChild(info);
        gamesList.appendChild(card);
      }
    }

    function parseLine(line) {
      const trimmed = line.trim();
      if (!trimmed) return null;
      const parts = trimmed.split('--').map(part => part.trim());
      if (parts.length >= 2) {
        const [href, title, ...thumbParts] = parts;
        const thumb = thumbParts.length ? thumbParts.join(' -- ') : '';
        return {
          href,
          title,
          thumb
        };
      }
      return {
        href: `${trimmed}.html`,
        title: trimmed,
        thumb: ''
      };
    }

    async function loadGameNames() {
      try {
        const response = await fetch('GAMENAMES');
        if (!response.ok) {
          throw new Error(`Error al cargar GAMENAMES: ${response.status}`);
        }
        const text = await response.text();
        const lines = text.split(/\r?\n/);
        games = lines.map(parseLine).filter(Boolean);

        renderGames(searchInput.value);
      } catch (error) {
        console.error('Error cargando GAMENAMES:', error);
      }
    }

    searchInput.addEventListener('input', () => renderGames(searchInput.value));
    loadGameNames();
  </script>
</body>
</html>
