<body>
<header>
  <h1>GUANTE DE <b>PÍXELES</b></h1>
  <span>10 etapas · 10 jefes</span>

<div id="wrap"><canvas id="game" role="img" aria-label="Guante de Píxeles, juego de plataformas y combate contra jefes" width="320" height="180"></canvas></div>

<div id="pad">
  <div class="grp">
    <button data-k="left" aria-label="Mover a la izquierda">◀</button>
    <button data-k="right" aria-label="Mover a la derecha">▶</button>
  </div>
  <button id="padPause" data-k="start" aria-label="Pausar o continuar" style="width:46px;height:46px;align-self:center;font-size:13px;">II</button>

  <kbd>←</kbd> <kbd>→</kbd> mover · <kbd>Z</kbd> / <kbd>espacio</kbd> saltar · <kbd>X</kbd> disparar · <kbd>Enter</kbd> pausa / cambiar de etapa · <kbd>M</kbd> silenciar
</footer>

<script>
(function(){
"use strict";

/* ─────────────────────────── base ─────────────────────────── */
const W=320, H=180, FLOOR=156;
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
cv.width=W; cv.height=H; ctx.imageSmoothingEnabled=false;
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const aabb=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function txt(s,x,y,c,align,size){
  ctx.font=(size||8)+'px "Courier New",monospace';
  ctx.textAlign=align||'left'; ctx.textBaseline='top'; ctx.fillStyle=c;
  ctx.fillText(s,Math.round(x),Math.round(y));
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ─────────────────────────── audio ─────────────────────────── */
let AC=null, muted=false;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;} } return AC; }
function tone(f,dur,type,vol,slide){
  if(muted) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+dur);
  g.gain.setValueAtTime((vol||.06),a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
const sfx={
  jump:()=>tone(330,.13,'square',.05,660),
  shoot:()=>tone(880,.06,'square',.035,300),
  hit:()=>tone(160,.09,'square',.05,90),
  hurt:()=>tone(220,.28,'sawtooth',.07,70),
  coin:()=>tone(1046,.07,'square',.04,1568),
  boom:()=>tone(90,.35,'sawtooth',.08,40),
  clear:()=>{tone(523,.1,'square',.06);setTimeout(()=>tone(659,.1,'square',.06),110);setTimeout(()=>tone(784,.2,'square',.06),220);},
  boss:()=>{tone(110,.5,'sawtooth',.07);setTimeout(()=>tone(146,.5,'sawtooth',.07),260);}
};

/* ─────────────────────────── input ─────────────────────────── */
const keys={left:false,right:false,up:false,jump:false,shoot:false,start:false};
const MAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',
  Space:'jump',KeyZ:'jump',KeyJ:'jump',KeyX:'shoot',KeyK:'shoot',Enter:'start',Escape:'start',ArrowDown:'down',KeyS:'down'};
let pressed={};
addEventListener('keydown',e=>{
  if(e.code==='KeyM'){muted=!muted;}
  const k=MAP[e.code]; if(k){ if(!keys[k]) pressed[k]=true; keys[k]=true; e.preventDefault(); }
  if(e.code==='Space'||e.code==='Enter') e.preventDefault();
  if(ac()&&ac().state==='suspended') ac().resume();
});
addEventListener('keyup',e=>{const k=MAP[e.code]; if(k) keys[k]=false;});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault(); if(!keys[k])pressed[k]=true; keys[k]=true;
    if(k==='jump'||k==='shoot'){ keys.start=true; pressed.start=true; }
    if(ac()&&ac().state==='suspended')ac().resume();};
  const off=e=>{e.preventDefault(); keys[k]=false; if(k!=='start') keys.start=false;};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off);
  b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
});
cv.addEventListener('pointerdown',()=>{ if(state!=='title'){ pressed.start=true; keys.start=true; setTimeout(()=>keys.start=false,60); } if(ac()&&ac().state==='suspended')ac().resume(); });
function tapped(k){ const v=!!pressed[k]; pressed[k]=false; return v; }

/* ─────────────────────────── etapas ─────────────────────────── */
const STAGES=[
 {name:'BOSQUE DE SETAS', tag:'reino de tuberias', deco:'mush',
  pal:{sky:'#5fb3ff',sky2:'#a9dcff',far:'#3f8f5a',gr:'#8a5a2b',top:'#4fbf46',pl:'#c46b2b',plTop:'#e89a4b',ac:'#ffd24a'},
  boss:{name:'REY CAPARAZON',hp:7,hearts:true,
  tip:'Salta hacia el borde justo cuando el toque el suelo: la onda de choque sale por ambos lados a ras de tierra. Dispara mientras esta en el aire, es cuando no puede defenderse.'}},
 {name:'CIUDAD ANDAMIO', tag:'grua y barriles', deco:'girder',
  pal:{sky:'#17102e',sky2:'#2a1a4d',far:'#3a2560',gr:'#b8362a',top:'#e05a3d',pl:'#e05a3d',plTop:'#ff8a5c',ac:'#f7c948'},
  boss:{name:'SIMIO COLOSAL',hp:8,
  tip:'Los barriles ruedan por el suelo: saltalos en vez de esquivarlos de lado. Dispara sin parar, el simio no se cubre, solo hay que aguantar el ritmo de esquivas.'}},
 {name:'LABERINTO NEON', tag:'come-puntos', deco:'maze',
  pal:{sky:'#04040e',sky2:'#0a0a22',far:'#141466',gr:'#1b2ea8',top:'#4d7bff',pl:'#3d6bff',plTop:'#8fb4ff',ac:'#ffe14a'},
  boss:{name:'ESPECTRO DEVORADOR',hp:9,hearts:true,
  tip:'Se vuelve intangible y brilla tenue: no dispares en ese momento, tus balas lo atraviesan sin hacer nada. Ataca solo cuando tenga color solido.'}},
 {name:'CINTURON ASTEROIDE', tag:'invasores', deco:'space',
  pal:{sky:'#01010a',sky2:'#060620',far:'#1a1a3a',gr:'#2b2b45',top:'#54ff6a',pl:'#3a3a5c',plTop:'#7ce68a',ac:'#54ff6a'},
  boss:{name:'NAVE NODRIZA',hp:10,
  tip:'Se mueve en linea recta arriba: colocate debajo y dispara hacia arriba sin parar. Cuidado con los invasores en zigzag que suelta cada cierto tiempo.'}},
 {name:'FOSO DE BLOQUES', tag:'tetraminos', deco:'blocks',
  pal:{sky:'#0b0b18',sky2:'#181436',far:'#241c50',gr:'#2f3350',top:'#6fd0ff',pl:'#7a58d0',plTop:'#b58cff',ac:'#ff6ba8'},
  boss:{name:'NUCLEO TETROMINO',hp:10,hearts:true,
  tip:'El escudo de bloques gira sin parar; solo puedes hacer dano cuando el centro se abre y se ve rosa. Aprovecha esa ventana para vaciar todo tu disparo.'}},
 {name:'SELVA PERDIDA', tag:'lianas y fosos', deco:'jungle',
  pal:{sky:'#0e3a2a',sky2:'#1d6b45',far:'#14523a',gr:'#5a3a1e',top:'#2fae5e',pl:'#8b5a2b',plTop:'#3ec972',ac:'#ffd24a'},
  boss:{name:'SERPIENTE ANCESTRAL',hp:11,
  tip:'Solo la cabeza recibe dano, el cuerpo largo solo te hace dano a ti. Sigue la cabeza con la mira y dispara cuando pase cerca de tu altura.'}},
 {name:'MAZMORRA ANCESTRAL', tag:'la trifuerza rota', deco:'dungeon',
  pal:{sky:'#0d0b14',sky2:'#1a1626',far:'#2a2438',gr:'#4a4258',top:'#8a80a0',pl:'#6b6280',plTop:'#a79bc0',ac:'#ffcf5a'},
  boss:{name:'GUARDIAN DE PIEDRA',hp:12,hearts:true,
  tip:'Antes de embestir se prepara un instante: usa ese momento para posicionarte debajo y disparar hacia arriba cuando salte. En el aterrizaje suelta rocas hacia los lados.'}},
 {name:'CIRCUITO TURBO', tag:'atardecer a 300', deco:'road',
  pal:{sky:'#ff7a3d',sky2:'#ffd08a',far:'#8a3a6a',gr:'#33333f',top:'#9aa0b0',pl:'#55556a',plTop:'#c8ccd8',ac:'#ff3b5c'},
  boss:{name:'BOLIDO BLINDADO',hp:12,
  tip:'Cruza la pantalla de lado a lado a toda velocidad: saltalo en el momento justo. Cuando se detiene en un extremo es tu ventana para dispararle de frente.'}},
 {name:'DOJO DEL TRUENO', tag:'segundo asalto', deco:'dojo',
  pal:{sky:'#2a1020',sky2:'#5c1f33',far:'#7a2a40',gr:'#6b3a2b',top:'#c98a4b',pl:'#8a4a3a',plTop:'#d9a05c',ac:'#ffd24a'},
  boss:{name:'MAESTRO TORMENTA',hp:13,hearts:true,
  tip:'Antes de la embestida rapida se agacha un instante: saltalo justo en ese momento. Las ondas de energia van a ras de suelo, saltalas con tiempo.'}},
 {name:'NUCLEO DIGITAL', tag:'sistema final', deco:'digital',
  pal:{sky:'#02040c',sky2:'#041424',far:'#073044',gr:'#0b3a4a',top:'#00e5ff',pl:'#0e5a72',plTop:'#5ef0ff',ac:'#ff2fd0'},
  boss:{name:'EL PROGRAMA',hp:16,
  tip:'Tiene tres fases que rotan: rafaga radial, aviso de laser vertical (huye de la linea blanca) y torretas rastreadoras. Muevete siempre, nunca te quedes quieto mas de un segundo.'}},
 {name:'CUEVA OCULTA', tag:'un secreto bien guardado', deco:'secret', secret:true,
  pal:{sky:'#150a26',sky2:'#2a1148',far:'#3a1a5c',gr:'#241238',top:'#8a4fd8',pl:'#4a2a70',plTop:'#b085ff',ac:'#ffd24a'},
  boss:{name:'GUARDIAN DEL SECRETO',hp:7,hearts:true,
  tip:'Solo baja la guardia cuando termina su giro y se marea un instante: esa es tu unica ventana, aprovechala entera.'}}
];

/* ────────────────────── generador de niveles ────────────────────── */
function genLevel(i){
  const rnd=mulberry32(9137+i*7919);
  const width=1700+i*95;
  const solids=[], hazards=[], enemies=[], coins=[], movers=[];
  solids.push({x:0,y:FLOOR,w:230,h:24});
  let x=230;
  while(x<width-300){
    x+=18+Math.floor(rnd()*13);
    const segw=110+Math.floor(rnd()*150);
    solids.push({x:x,y:FLOOR,w:segw,h:24});
    const n=1+(rnd()<.45?1:0);
    for(let k=0;k<n;k++){
      const pw=32+Math.floor(rnd()*3)*16;
      const px=x+6+Math.floor(rnd()*Math.max(8,segw-pw-12));
      const py=[100,114,128][Math.floor(rnd()*3)];
      solids.push({x:px,y:py,w:pw,h:8,thin:true});
      if(rnd()<.75) coins.push({x:px+pw/2-3,y:py-16,got:false});
    }
    if(rnd()<.8){
      const roll=rnd();
      if(roll<.34) enemies.push(mkEnemy('walk',x+14+rnd()*Math.max(8,segw-34),FLOOR-12,x+4,x+segw-14));
      else if(roll<.54) enemies.push(mkEnemy('fly',x+20+rnd()*Math.max(8,segw-40),96+rnd()*22,x-20,x+segw+20));
      else if(i>=1&&roll<.7) enemies.push(mkEnemy('hopper',x+16+rnd()*Math.max(8,segw-32),FLOOR-12,x+4,x+segw-14));
      else if(i>=2&&roll<.86) enemies.push(mkEnemy('spinner',x+segw/2,92+rnd()*20,0,0));
      else if(i>=3) enemies.push(mkEnemy('charger',x+16+rnd()*Math.max(8,segw-32),FLOOR-11,x-30,x+segw+30));
      else enemies.push(mkEnemy('walk',x+14+rnd()*Math.max(8,segw-34),FLOOR-12,x+4,x+segw-14));
    }
    if(i>=4&&rnd()<.35&&segw>90) hazards.push({x:x+20+Math.floor(rnd()*(segw-70)),y:FLOOR-8,w:24,h:8});
    if(i>=5&&rnd()<.3) enemies.push(mkEnemy('turret',x+segw-18,FLOOR-14,0,0));
    if(i>=3&&rnd()<.4){
      movers.push({x:x+segw+4,y:108+Math.floor(rnd()*22),w:40,h:8,vert:rnd()<.45,r:24+rnd()*18,s:.012+rnd()*.012,t:rnd()*6.28,ox:0,oy:0,dx:0,dy:0});
    }
    x+=segw;
  }
  const finalGap=18+Math.floor(rnd()*13);
  const last=Math.max(x,Math.min(x+finalGap,width-140));
  solids.push({x:last,y:FLOOR,w:Math.max(300,width-last),h:24});
  for(let c=0;c<4;c++) coins.push({x:260+rnd()*(width-400),y:FLOOR-22,got:false});

  const floorSolids=solids.filter(s2=>!s2.thin);
  const target=width*0.55;
  let seg=floorSolids.find(s2=>target>=s2.x+34&&target<=s2.x+s2.w-34);
  if(!seg) seg=floorSolids.reduce((a2,b2)=>Math.abs((b2.x+b2.w/2)-target)<Math.abs((a2.x+a2.w/2)-target)?b2:a2);
  const mbx=clamp(target,seg.x+18,seg.x+seg.w-38);
  enemies.push(mkEnemy('mini',mbx,FLOOR-20,seg.x+6,seg.x+seg.w-26));

  return {width,solids,hazards,enemies,coins,movers,goal:{x:width-46,y:FLOOR-34,w:14,h:34}};
}
function mkEnemy(type,x,y,a,b){
  const e={type,x,y,w:12,h:12,vx:.45,t:Math.random()*6.28,a,b,alive:true,base:y,hp:1,cd:60+Math.floor(Math.random()*60)};
  if(type==='fly'){e.w=12;e.h=10;e.vx=.7;}
  if(type==='turret'){e.w=14;e.h=14;e.vx=0;e.hp=2;}
  if(type==='mini'){e.w=20;e.h=20;e.vx=.4;e.hp=5;e.max=5;e.cd=70;}
  if(type==='hopper'){e.w=12;e.h=12;e.vx=.4;e.vy=-4.2;}
  if(type==='spinner'){e.w=10;e.h=10;e.vx=0;e.cx=x;e.cy=y;e.rad=16+Math.random()*12;e.cd=100;}
  if(type==='charger'){e.w=13;e.h=10;e.vx=.35;e.hp=2;e.st=0;e.cd=0;}
  return e;
}

/* ─────────────────────────── estado ─────────────────────────── */
let state='title', stage=0, level=null, cam=0, t=0, score=0, best=0, foundSecret=false;
try{ foundSecret=localStorage.getItem('pg_secret')==='1'; }catch(e){}
let shake=0, flash=0, msgT=0, transT=0, phaseBoss=false, sel=0, pauseFrom=null, pauseSel=0;
const player={x:24,y:120,w:10,h:14,vx:0,vy:0,ground:false,face:1,inv:0,cd:0,hp:5,max:5,anim:0,ride:null,safe:{x:24,y:120},dead:false};
let bullets=[], ebullets=[], parts=[], boss=null, arena=null;

try{ const b=localStorage.getItem('pg_best'); if(b) best=parseInt(b,10)||0; }catch(e){}
function saveBest(){ try{ localStorage.setItem('pg_best',String(best)); }catch(e){} }

function resetPlayer(){
  player.x=24;player.y=FLOOR-40;player.vx=0;player.vy=0;player.hp=player.max;
  player.inv=60;player.cd=0;player.dead=false;player.safe={x:24,y:FLOOR-40};
  bullets=[];ebullets=[];parts=[];
}
function startStage(i){
  stage=i; level=genLevel(i); cam=0; resetPlayer(); boss=null; arena=null; phaseBoss=false;
  state='intro'; transT=0;
}
function goToBoss(){
  phaseBoss=true;
  const st=STAGES[stage];
  arena={solids:[{x:0,y:FLOOR,w:W,h:24}].concat(stage===1?[{x:112,y:112,w:96,h:8,thin:true},{x:18,y:130,w:44,h:8,thin:true},{x:258,y:130,w:44,h:8,thin:true}]:[{x:22,y:118,w:54,h:8,thin:true},{x:244,y:118,w:54,h:8,thin:true}])};
  boss={i:stage,name:st.boss.name,hp:st.boss.hp,max:st.boss.hp,t:0,x:200,y:FLOOR-34,w:34,h:34,
        vx:1.1,vy:0,st:0,shield:false,air:false,flash:0,segs:[],alive:true,dead:0,
        raged:false,rageT:0,warnT:0,lx:0};
  const B=boss;
  if(stage===1){B.w=38;B.h=34;B.x=130;B.y=112-34;}
  if(stage===2){B.w=26;B.h=26;B.x=240;B.y=70;}
  if(stage===3){B.w=52;B.h=20;B.x=140;B.y=70;}
  if(stage===4){B.w=36;B.h=28;B.x=142;B.y=88;}
  if(stage===5){B.w=18;B.h=16;B.x=160;B.y=90;}
  if(stage===6){B.w=30;B.h=32;B.y=FLOOR-32;}
  if(stage===7){B.w=44;B.h=20;B.x=-60;B.y=FLOOR-20;B.vx=3.2;}
  if(stage===8){B.w=16;B.h=26;B.y=FLOOR-26;B.x=250;}
  if(stage===9){B.w=40;B.h=40;B.x=140;B.y=52;}
  if(stage===10){B.w=28;B.h=30;B.x=146;B.y=FLOOR-30;}
  player.x=30;player.y=FLOOR-30;player.vx=0;player.vy=0;player.inv=60;
  bullets=[];ebullets=[];parts=[];
  state='bossintro'; transT=0; sfx.boss();
}
function startBoss(){
  state='tip'; transT=0; phaseBoss=false;
}

/* ─────────────────────────── física ─────────────────────────── */
function solidsNow(){
  if(phaseBoss&&arena) return arena.solids;
  return level.solids.concat(level.movers.map(m=>({x:m.x,y:m.y,w:m.w,h:m.h,thin:true,mover:m})));
}
function moveActor(a,solids){
  a.x+=a.vx;
  for(const s of solids){
    if(s.thin) continue;
    if(aabb(a,s)){ if(a.vx>0) a.x=s.x-a.w; else if(a.vx<0) a.x=s.x+s.w; a.vx=0; }
  }
  a.y+=a.vy; a.ground=false; a.ride=null;
  for(const s of solids){
    if(!aabb(a,s)) continue;
    if(s.thin){
      if(a.vy>=0 && a.y+a.h-a.vy<=s.y+4){ a.y=s.y-a.h; a.vy=0; a.ground=true; a.ride=s.mover||null; }
    }else{
      if(a.vy>0){ a.y=s.y-a.h; a.vy=0; a.ground=true; }
      else if(a.vy<0){ a.y=s.y+s.h; a.vy=.5; }
    }
  }
}

function hurt(n){
  if(player.inv>0||player.dead) return;
  player.hp-=n||1; player.inv=80; shake=8; sfx.hurt();
  for(let i=0;i<10;i++) burst(player.x+5,player.y+7,'#ff5c7a');
  if(player.hp<=0){ player.dead=true; player.vy=-3.6; sfx.boom(); }
}
function burst(x,y,c){ parts.push({x,y,vx:(Math.random()-.5)*2.4,vy:(Math.random()-.5)*2.4-.6,l:16+Math.random()*14,c}); }

function updatePlayer(){
  const acc=.5, maxs=1.72, fr=.72;
  if(player.dead){ player.vy+=.35; player.y+=player.vy; return; }
  if(keys.left){ player.vx-=acc; player.face=-1; }
  if(keys.right){ player.vx+=acc; player.face=1; }
  if(!keys.left&&!keys.right) player.vx*=fr;
  player.vx=clamp(player.vx,-maxs,maxs);
  if((tapped('jump')||tapped('up'))&&player.ground){ player.vy=-6.35; player.ground=false; sfx.jump(); }
  if(!keys.jump&&!keys.up&&player.vy<-2) player.vy+=.28;
  player.vy=clamp(player.vy+.44,-9,7.2);
  const S=solidsNow();
  const wasRide=player.ride;
  moveActor(player,S);
  if(player.ride&&player.ride===wasRide){ player.x+=player.ride.dx; player.y+=player.ride.dy; }
  if(!phaseBoss) player.x=clamp(player.x,0,level.width-player.w);
  else player.x=clamp(player.x,2,W-player.w-2);
  if(player.ground&&Math.abs(player.vx)>.2) player.anim+=.22; else player.anim=0;
  if(player.inv>0) player.inv--;
  if(player.cd>0) player.cd--;
  if(keys.shoot&&player.cd<=0){
    player.cd=15; sfx.shoot();
    bullets.push({x:player.x+(player.face>0?9:-2),y:player.y+6,w:5,h:3,vx:player.face*3.6});
  }
  if(player.ground&&player.y<FLOOR) player.safe={x:player.x,y:player.y-2};
  if(player.ground&&player.y+player.h<=FLOOR+1) player.safe={x:player.x,y:player.y-2};
  if(player.y>H+24){
    if(!phaseBoss){ hurt(1); if(!player.dead){ player.x=player.safe.x; player.y=player.safe.y-16; player.vy=0; player.vx=0; } }
    else { hurt(1); player.x=30; player.y=FLOOR-30; player.vy=0; }
  }
}

/* ─────────────────────────── enemigos ─────────────────────────── */
function updateEnemies(){
  for(const e of level.enemies){
    if(!e.alive) continue;
    if(Math.abs(e.x-(cam+160))>230) continue;
    e.t+=.05;
    if(e.type==='walk'){
      e.x+=e.vx; if(e.x<e.a||e.x+e.w>e.b) e.vx*=-1;
    }else if(e.type==='fly'){
      e.x+=e.vx; if(e.x<e.a||e.x+e.w>e.b) e.vx*=-1;
      e.y=e.base+Math.sin(e.t*1.6)*16;
    }else if(e.type==='turret'){
      e.cd--; if(e.cd<=0){ e.cd=110;

        if(d<150) ebullets.push({x:e.x+5,y:e.y+4,w:5,h:5,vx:Math.sign(dx)*1.6,vy:0,c:'#ff8a3d',l:200});

    }else if(e.type==='mini'){
      e.x+=e.vx; if(e.x<e.a||e.x+e.w>e.b) e.vx*=-1;

      }
    }else if(e.type==='hopper'){
      e.x+=e.vx; if(e.x<e.a||e.x+e.w>e.b) e.vx*=-1;
      e.vy+=.32; e.y+=e.vy;
      if(e.y>=e.base){ e.y=e.base; e.vy=-4.2; }
    }else if(e.type==='spinner'){
      e.x=e.cx+Math.cos(e.t*.6)*e.rad; e.y=e.cy+Math.sin(e.t*.6)*e.rad;
      e.cd--; if(e.cd<=0){ e.cd=140;
        const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
        if(d<170) ebullets.push({x:e.x+5,y:e.y+5,w:5,h:5,vx:dx/d*1.1,vy:dy/d*1.1,c:'#c86bff',l:240});
      }
    }else if(e.type==='charger'){
      if(e.st===0){
        e.x+=e.vx; if(e.x<e.a||e.x+e.w>e.b) e.vx*=-1;
        if(Math.abs(player.x-e.x)<70&&Math.abs(player.y-e.y)<20&&Math.abs(e.vx)>0){ e.st=1; e.cd=16; }
      }else if(e.st===1){
        e.cd--; if(e.cd<=0){ e.st=2; e.vx=(player.x<e.x?-2.6:2.6); }
      }else{
        e.x+=e.vx;
        if(e.x<e.a-60||e.x+e.w>e.b+60){ e.st=0; e.vx=e.vx>0?.35:-.35; }
      }
    }
    if(aabb(player,e)){
      if(player.vy>.6&&player.y+player.h-player.vy<=e.y+5&&e.type!=='turret'){
        if(e.type==='mini'){
          e.hp--; player.vy=-4.2; sfx.hit();
          for(let i=0;i<6;i++) burst(e.x+10,e.y+10,STAGES[stage].pal.ac);
          if(e.hp<=0){ e.alive=false; score+=200; for(let i=0;i<12;i++) burst(e.x+10,e.y+10,'#ffd24a'); shake=Math.max(shake,6); }
        }else{

          for(let i=0;i<8;i++) burst(e.x+6,e.y+6,'#ffd24a');
        }
      } else hurt(1);
    }
  }
  for(const h of level.hazards){ if(aabb(player,h)) hurt(1); }
  for(const c of level.coins){
    if(c.got) continue;
    if(aabb(player,{x:c.x,y:c.y,w:6,h:8})){ c.got=true; score+=100; sfx.coin(); for(let i=0;i<5;i++) burst(c.x+3,c.y+4,'#ffe14a'); }
  }
  for(const m of level.movers){
    const px=m.x,py=m.y; m.t+=m.s;
    if(m.vert){ m.y=(m.oy||(m.oy=py))+Math.sin(m.t)*m.r; } else { m.x=(m.ox||(m.ox=px))+Math.sin(m.t)*m.r; }
    m.dx=m.x-px; m.dy=m.y-py;
  }
}

/* ─────────────────────────── proyectiles ─────────────────────────── */
function eb(x,y,vx,vy,c,o){ ebullets.push(Object.assign({x,y,w:5,h:5,vx,vy,c:c||'#ff5c7a',l:260,g:0},o||{})); }
function updateBullets(){
  for(const b of bullets){
    b.x+=b.vx;
    if(!phaseBoss){
      for(const e of level.enemies){
        if(e.alive&&aabb(b,e)){ e.hp--; b.dead=true; sfx.hit(); for(let i=0;i<5;i++) burst(b.x,b.y,'#fff'); if(e.hp<=0){e.alive=false;score+=60;for(let i=0;i<8;i++)burst(e.x+6,e.y+6,'#ffd24a');} }
      }
      if(b.x<cam-20||b.x>cam+W+20) b.dead=true;
    }else{
      if(boss&&boss.alive&&!boss.shield&&aabb(b,boss)){
        boss.hp--; boss.flash=6; b.dead=true; sfx.hit(); score+=25;
        for(let i=0;i<4;i++) burst(b.x,b.y,'#fff');
        if(boss.hp<=0){ boss.alive=false; boss.dead=1; sfx.boom(); shake=14; score+=1000; }
      } else if(boss&&boss.shield&&aabb(b,boss)){ b.dead=true; tone(300,.05,'square',.03,180); }
      if(b.x<-20||b.x>W+20) b.dead=true;
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  for(const b of ebullets){
    if(b.g) b.vy+=b.g;
    b.x+=b.vx; b.y+=b.vy; b.l--;
    if(b.home&&b.l%2===0){ const dx=player.x-b.x, dy=player.y-b.y, d=Math.hypot(dx,dy)||1; b.vx+=dx/d*.02; b.vy+=dy/d*.02; b.vx=clamp(b.vx,-.9,.9); b.vy=clamp(b.vy,-.9,.9); }
    if(b.bounce&&b.y+b.h>=FLOOR){ b.y=FLOOR-b.h; b.vy=-2.2; }
    if(b.land&&b.y+b.h>=FLOOR){ b.y=FLOOR-b.h; b.vy=0; b.vx=0; b.g=0; }
    if(aabb(player,b)) hurt(1);
    if(b.l<=0||b.y>H+30||b.x<-40||b.x>W+40) b.dead=true;
  }
  ebullets=ebullets.filter(b=>!b.dead);
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=.08; p.l--; }
  parts=parts.filter(p=>p.l>0);
}

function wrapText(str,cx,y,maxw,color,size,lh){
  ctx.font=(size||7)+'px "Courier New",monospace';
  const words=str.split(' ');
  let line='', lines=[];
  for(const wd of words){
    const test=line?line+' '+wd:wd;
    if(ctx.measureText(test).width>maxw && line){ lines.push(line); line=wd; }
    else line=test;
  }
  if(line) lines.push(line);
  lines.forEach((ln,i)=>txt(ln,cx,y+i*(lh||9),color,'center',size));
  return lines.length;
}

function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#8fd6e8'); g.addColorStop(.35,'#bfe89a'); g.addColorStop(1,'#6bb35c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let i=0;i<5;i++){ const x=(i*90+t*.12)%(W+80)-40, y=14+((i*23)%18);
    R(x,y,20,6,'#ffffffcc'); R(x+5,y-3,12,6,'#ffffffcc'); R(x-4,y+2,10,4,'#ffffffaa'); }
  for(let i=0;i<7;i++){ const x=20+i*44, y=6+((i*31)%10); R(x,y,26,10,'#5a9e48'); }

  // rio que serpentea de fondo, cruzando bajo los puentes del sendero
  ctx.globalAlpha=.9;
  for(let px=-10;px<W+10;px+=3){
    const py=96+Math.sin(px*.028)*30+Math.sin(px*.007)*14;
    R(px,py,4,10+Math.sin(px*.05)*3,'#3a8fd8'); R(px,py+1,4,3,'#8fd0f0');
  }
  ctx.globalAlpha=1;
  MAPROCKS.forEach(r=>mapRock(r.x,r.y,r.s));
  MAPTREES.forEach(tr=>mapTree(tr.x,tr.y,tr.s));

  // sendero de tierra que serpentea entre las 10 etapas
  for(let i=0;i<MAPNODES.length-1;i++){
    const a=MAPNODES[i], b=MAPNODES[i+1];
    const dx=b.x-a.x, dy=b.y-a.y, steps=Math.max(Math.abs(dx),Math.abs(dy));
    for(let s2=0;s2<=steps;s2+=4){
      const px=a.x+dx*(s2/steps), py=a.y+dy*(s2/steps);
      R(px-2,py-2,5,5,'#4a3626'); R(px-1,py-1,3,3,'#6b4a30');
    }
  }
  // ramal tenue y oculto hacia el nivel secreto (apenas visible hasta que lo encuentras)
  {
    const a=MAPNODES[5];
    const dx=SECRETNODE.x-a.x, dy=SECRETNODE.y-a.y, steps=Math.max(Math.abs(dx),Math.abs(dy));
    ctx.globalAlpha=foundSecret?.9:.16;
    for(let s2=0;s2<=steps;s2+=6){
      const px=a.x+dx*(s2/steps), py=a.y+dy*(s2/steps);
      R(px-1,py-1,3,3,foundSecret?'#b085ff':'#5a4a70');
    }
    ctx.globalAlpha=1;
  }

  for(let i=0;i<MAPNODES.length;i++){
    const n=MAPNODES[i], on=i===sel, y=n.y+(on?Math.sin(t*.14)*2:0);
    if(on){ ctx.globalAlpha=.5+.3*Math.sin(t*.3); R(n.x-9,y-9,18,18,'#ff3d7f'); ctx.globalAlpha=1; }
    R(n.x-7,y-7,14,14,STAGES[i].pal.gr); R(n.x-5,y-5,10,10,STAGES[i].pal.sky); R(n.x-2,y-2,4,4,STAGES[i].pal.ac);
    txt(String(i+1),n.x,y+10,on?'#ffffff':'#8a80b0','center',6);
  }
  // nodo secreto: apenas un punto grisaceo hasta que lo visitas, luego brilla
  {
    const on=sel===10, y=SECRETNODE.y+(on?Math.sin(t*.14)*2:0);
    if(foundSecret||on){
      if(on){ ctx.globalAlpha=.5+.3*Math.sin(t*.3); R(SECRETNODE.x-9,y-9,18,18,'#00e5ff'); ctx.globalAlpha=1; }
      R(SECRETNODE.x-7,y-7,14,14,'#3a1a5c'); R(SECRETNODE.x-5,y-5,10,10,'#8a4fd8');
      txt('?',SECRETNODE.x,y+10,on?'#ffffff':'#b085ff','center',7);
    }else{
      ctx.globalAlpha=.3; R(SECRETNODE.x-3,SECRETNODE.y-3,6,6,'#3a3350'); ctx.globalAlpha=1;
    }
  }
  const curNode=sel===10?SECRETNODE:MAPNODES[sel];
  mapPlayer(curNode.x,curNode.y+(sel<10&&sel===sel?0:0));

  R(0,0,W,18,'#000000aa');
  txt('GUANTE DE PIXELES',160,4,'#ffffff','center',10);
  R(0,H-38,W,38,'#000000cc');
  if(sel===10){
    txt('???',160,H-34,'#b085ff','center',10);
    txt('jefe: '+(foundSecret?STAGES[10].boss.name:'???'),160,H-22,'#ffffff','center');
  }else{
    txt(STAGES[sel].name,160,H-34,'#ffd24a','center',10);
    txt('jefe: '+STAGES[sel].boss.name,160,H-22,'#ffffff','center');
  }
  txt(Math.floor(t/22)%2?'< > CAMINAR   ·   SALTO: ENTRAR   ·   ARRIBA: EXPLORAR':'',160,H-10,'#b9b0e8','center',6);
  if(best>0) txt('mejor avance: etapa '+Math.min(best,10),W-4,4,'#6a5fa8','right',6);
  ctx.globalAlpha=.1; for(let y=0;y<H;y+=2) R(0,y,W,1,'#000'); ctx.globalAlpha=1;
}

/* ─────────────────────────── bucle ─────────────────────────── */
function update(){
  t++;
  if((state==='intro'||state==='play'||state==='bossintro'||state==='boss'||state==='tip')&&tapped('start')){
    pauseFrom=state; pauseSel=stage; state='pause'; return;
  }
  if(state==='pause'){
    if(tapped('left')) pauseSel=(pauseSel+9)%10;
    if(tapped('right')) pauseSel=(pauseSel+1)%10;
    if(tapped('jump')){ startStage(pauseSel); return; }
    if(tapped('shoot')||tapped('start')){ state=pauseFrom; return; }
    return;
  }
  if(state==='title'){
    if(sel===10){
      if(tapped('down')||tapped('left')||tapped('right')) sel=5;
    }else{
      if(tapped('left')) sel=(sel+9)%10;
      if(tapped('right')) sel=(sel+1)%10;
      if(sel===5&&tapped('up')){ sel=10; foundSecret=true; try{localStorage.setItem('pg_secret','1');}catch(e){} }
    }
    if(tapped('jump')||tapped('start')){ score=0; startStage(sel); }
    return;
  }
  if(state==='intro'){
    transT++; updatePlayer();
    if(transT>110||tapped('jump')) state='play';
    return;
  }
  if(state==='tip'){
    transT++;
    if(transT>20&&(tapped('jump')||tapped('shoot'))) goToBoss();
    return;
  }
  if(state==='play'){
    updatePlayer(); updateEnemies(); updateBullets();
    cam=clamp(player.x-140,0,level.width-W);
    if(player.dead&&player.y>H+40){ state='over'; transT=0; }
    if(player.hp<=0&&!player.dead){ state='over'; transT=0; }
    if(aabb(player,level.goal)){ startBoss(); }
    return;
  }
  if(state==='bossintro'){
    transT++; updatePlayer(); updateBullets();
    if(transT>90) state='boss';
    return;
  }
  if(state==='boss'){
    updatePlayer(); updateBoss(); updateBullets();
    if(player.dead&&player.y>H+40){ state='over'; transT=0; }
    if(player.hp<=0&&!player.dead){ state='over'; transT=0; }
    return;
  }
  if(state==='clear'){
    transT++; updateBullets();
    if(transT>70&&(tapped('jump')||tapped('start'))){
      if(stage===10){ sel=10; state='title'; }
      else if(stage>=9){ state='win'; transT=0; }
      else { startStage(stage+1); }
    }
    return;
  }
  if(state==='over'){
    transT++; updateBullets();
    if(transT>50&&(tapped('jump')||tapped('start'))){ startStage(stage); }
    return;
  }
  if(state==='win'){
    transT++;
    if(transT>60&&(tapped('jump')||tapped('start'))){ score=0; state='title'; }
    return;
  }
}
let acc=0,last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last); last=now; acc+=dt;
  while(acc>=16.6667){ update(); acc-=16.6667; }
  render();
  requestAnimationFrame(loop);
}
try{
  const qp=new URLSearchParams(location.search);
  const st=parseInt(qp.get('stage'),10);
  if(!Number.isNaN(st)&&st>=0&&st<=10){ score=0; startStage(st); }
}catch(e){}
requestAnimationFrame(loop);
})();
</script>
